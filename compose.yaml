services:
    caddy:
        image: ${CADDY_IMAGE:-ghcr.io/rkstraessler/caddy-domainbestellsystem:latest}
        restart: unless-stopped
        ports:
            - "443:443"
        env_file: .env
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./sites:/etc/caddy/sites:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - proxy

volumes:
    caddy_data:
    caddy_config:

networks:
    proxy:
        external: true
