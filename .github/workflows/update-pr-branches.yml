name: Update pull request branches

on:
    push:
        branches: [main]
    pull_request_target:
        branches: [main]
        types: [opened, reopened, synchronize, edited]
    workflow_run:
        workflows: [Dependabot merge]
        types: [completed]
    schedule:
        - cron: '17,47 * * * *'
    workflow_dispatch:

permissions: {}

concurrency:
    group: update-pr-branches
    cancel-in-progress: false

jobs:
    update:
        if: >-
            github.repository == 'rkstraessler/DBS-CaddyModule' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name != 'pull_request_target' ||
              github.event.pull_request.head.repo.full_name == github.repository) &&
            (github.event_name != 'workflow_run' ||
              (github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'pull_request_target' &&
                github.event.workflow_run.head_repository.full_name == github.repository))
        name: Update branches behind main
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: pr-branch-updates
        permissions:
            contents: read
        steps:
            - name: Check out trusted automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            # Installation tokens allow the new PR commit to trigger CI automatically.
            - name: Create a repository-scoped GitHub App token
              id: app
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.PR_AUTOMATION_CLIENT_ID }}
                  private-key: ${{ secrets.PR_AUTOMATION_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Update eligible pull requests
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  APP_SLUG: ${{ steps.app.outputs.app-slug }}
                  EXPECTED_APP_SLUG: ${{ vars.PR_AUTOMATION_SLUG }}
              shell: bash
              run: |
                  if [[ -z "$EXPECTED_APP_SLUG" || "$APP_SLUG" != "$EXPECTED_APP_SLUG" ]]; then
                      echo 'The GitHub App must match PR_AUTOMATION_SLUG.'
                      exit 1
                  fi
                  bash .github/scripts/ci/update-pr-branches.sh
