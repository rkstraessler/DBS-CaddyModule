name: Release
on:
    push:
        tags: ["v*"]

permissions:
    contents: read

concurrency:
    group: ghcr-stable-release
    cancel-in-progress: false
    queue: max

jobs:
    build:
        name: Verify release image
        runs-on: ubuntu-latest
        timeout-minutes: 40
        outputs:
            artifact-id: ${{ steps.image.outputs.artifact-id }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Verify release identity
              run: bash .github/scripts/release/publish.sh validate
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version-file: go.mod
            - run: bash .github/scripts/ci/verify-go.sh
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
            - name: Build and verify the release image
              shell: bash
              run: |
                  docker buildx build --platform linux/amd64 --output type=docker,rewrite-timestamp=true \
                      --build-arg "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" \
                      --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                      --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                      --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
                      --label "org.opencontainers.image.licenses=MIT" \
                      -t dbs-caddy:release .
                  bash .github/scripts/ci/verify-image.sh dbs-caddy:release
                  mkdir "$RUNNER_TEMP/caddy-image"
                  cd "$RUNNER_TEMP/caddy-image"
                  docker save -o image.tar dbs-caddy:release
                  sha256sum image.tar > image.sha256
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              id: image
              with:
                  name: caddy-release-image
                  path: ${{ runner.temp }}/caddy-image
                  if-no-files-found: error
                  retention-days: 2
                  compression-level: 1

    publish:
        name: Publish verified image
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  artifact-ids: ${{ needs.build.outputs.artifact-id }}
                  path: ${{ runner.temp }}/caddy-image
            - name: Verify and load the built artifact
              working-directory: ${{ runner.temp }}/caddy-image
              shell: bash
              run: |
                  sha256sum -c image.sha256
                  docker load -i image.tar
                  [[ "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' dbs-caddy:release)" == "$GITHUB_SHA" ]]
            - name: Publish the verified image and release notes
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/release/publish.sh publish
