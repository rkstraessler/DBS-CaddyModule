name: autofix.ci
on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    gofmt:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false
            - run: git ls-files '*.go' -z | xargs -0r gofmt -w
            - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
